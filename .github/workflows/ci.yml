name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .[dev]

    - name: Run Pytest suite
      run: |
        pytest -v

    - name: Run offline sample pipeline (first execution)
      run: |
        python -m scripts.pipeline --sample

    - name: Verify offline sample pipeline idempotency (second execution produces no evidence changes)
      run: |
        git status --porcelain > before_second_run.txt
        python -m scripts.pipeline --sample
        git status --porcelain > after_second_run.txt
        diff before_second_run.txt after_second_run.txt
